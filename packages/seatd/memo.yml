name: seatd
version: rolling
package_type: source
status: scaffold
summary: Minimal seat management daemon for Wayland compositors
license: MIT
homepage: https://sr.ht/~kennylevinsen/seatd/
source:
  type: git
  url: https://git.sr.ht/~kennylevinsen/seatd
dependencies:
  - glibc
build_dependencies:
  - meson
  - ninja
  - pkgconf
  - gcc
build:
  - meson setup build --prefix=/usr --sysconfdir=/etc
  - ninja -C build
install:
  - DESTDIR=${PKGDIR} ninja -C build install
reference_packaging:
  arch: Used for service/user group expectations.
  debian: Used for daemon integration comparison.
memo:
  stage: desktop-core
  lfs_safe: true
