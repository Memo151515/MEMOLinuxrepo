name: kdeconnect
version: 23.08.5
package_type: binary
status: stable
summary: KDE Connect - Telefon ve bilgisayar senkronizasyonu 
license: GPL-2.0+
homepage: https://kde.org/applications/system/kdeconnect/
source:
  type: web
  # Debian'ın snapshot (arşiv) servisinden doğrudan silinmeyecek sürüm:
  url: https://snapshot.debian.org/archive/debian/20240320T210515Z/pool/main/k/kdeconnect/kdeconnect_23.08.5-1%2Bb1_amd64.deb
build:
  - mkdir -p extracted
  - ar x ${SRC_TARBALL} --output=extracted
  - tar -xf extracted/data.tar.xz -C extracted/
install:
  - mkdir -p ${PKGDIR}/usr/local/bin
  - mkdir -p ${PKGDIR}/usr/local/lib64
  - mkdir -p ${PKGDIR}/usr/local/share
  - cp -r extracted/usr/bin/* ${PKGDIR}/usr/local/bin/ 2>/dev/null || true
  - cp -r extracted/usr/lib/x86_64-linux-gnu/* ${PKGDIR}/usr/local/lib64/ 2>/dev/null || true
  - cp -r extracted/usr/share/* ${PKGDIR}/usr/local/share/ 2>/dev/null || true
memo:
  stage: utility
  lfs_safe: true
