name: nvidia-drivers
version: 550.54.14
package_type: binary
status: stable
summary: NVIDIA Linux Graphics Driver
license: NVIDIA
homepage: https://www.nvidia.com/
source:
  type: web
  url: https://us.download.nvidia.com/XFree86/Linux-x86_64/550.54.14/NVIDIA-Linux-x86_64-550.54.14.run
build:
  - chmod +x ${SRC_TARBALL}
install:
  - sh ${SRC_TARBALL} --extract-only --target nvidia-tmp
  # Çalıştırılabilir araçları kopyala
  - mkdir -p ${PKGDIR}/usr/local/bin
  - cp nvidia-tmp/nvidia-smi ${PKGDIR}/usr/local/bin/
  - cp nvidia-tmp/nvidia-settings ${PKGDIR}/usr/local/bin/
  # Gerekli kütüphane (.so) dosyalarını kopyala
  - mkdir -p ${PKGDIR}/usr/local/lib64
  - cp -a nvidia-tmp/libnvidia-ml.so* ${PKGDIR}/usr/local/lib64/
  - cp -a nvidia-tmp/libnvidia-cfg.so* ${PKGDIR}/usr/local/lib64/
  - cp -a nvidia-tmp/libcuda.so* ${PKGDIR}/usr/local/lib64/
memo:
  stage: drivers
  lfs_safe: true
