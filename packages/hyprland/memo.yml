name: hyprland
version: rolling
package_type: source
status: scaffold
summary: Dynamic tiling Wayland compositor
license: BSD-3-Clause
homepage: https://hyprland.org/
source:
  type: git
  url: https://github.com/hyprwm/Hyprland.git
dependencies:
  - wayland
  - wayland-protocols
  - mesa
  - libinput
  - seatd
  - xwayland
build_dependencies:
  - cmake
  - meson
  - ninja
  - pkgconf
  - gcc
build:
  - cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr
  - cmake --build build
install:
  - DESTDIR=${PKGDIR} cmake --install build
reference_packaging:
  arch: Used for subproject and wlroots-era dependency mapping.
  debian: Used only for comparison where available; upstream changes quickly.
memo:
  stage: window-manager
  lfs_safe: true
