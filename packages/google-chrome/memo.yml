name: google-chrome
version: scaffold
summary: Google Chrome vendor browser integration placeholder for MEMO Linux
license: Proprietary
homepage: https://www.google.com/chrome/
source:
  type: vendor
  url: https://dl.google.com/linux/chrome/deb/
  directory: google-chrome-version-to-review
dependencies:
  - glibc
  - gtk3
  - nss
  - nspr
  - cups
  - dbus
  - fontconfig
  - freetype
  - mesa
build_dependencies:
  - bsdtar
  - patchelf
build:
  - review vendor redistribution terms before packaging
install:
  - stage reviewed vendor payload under ${PKGDIR}/opt/google/chrome and launcher under ${PKGDIR}/usr/bin
memo:
  stage: browser-vendor
  lfs_safe: false
  status: redistribution_review
  notes: Chrome is not a normal source package; MEMO should prefer Chromium for official source builds unless redistribution is explicitly approved.
